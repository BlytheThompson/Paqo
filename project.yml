# XcodeGen spec. The Xcode project is generated from this file on the Mac build runner
# (`xcodegen generate`), so there is no hand-edited .xcodeproj in the repo.
name: Paqo

options:
  bundleIdPrefix: com.paqo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  PaqoKit:
    path: PaqoKit

targets:
  Paqo:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: PaqoKit
        product: PaqoKit
      - target: PaqoWidgets
    info:
      path: Config/Paqo-Info.plist
      properties:
        CFBundleDisplayName: Paqo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - location
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Paqo uses your location to map your route and measure distance, pace and sprint speed.
        NSLocationAlwaysAndWhenInUseUsageDescription: Paqo uses your location to map your route and measure distance, pace and sprint speed.
        NSMotionUsageDescription: Paqo uses Motion & Fitness to count steps, measure cadence, tell sprints from walks and measure elevation with the barometer.
        NSHealthShareUsageDescription: Paqo only writes to Apple Health; it does not read your health data.
        NSHealthUpdateUsageDescription: Paqo saves your runs to Apple Health as running workouts with their route.
    entitlements:
      path: Config/Paqo.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paqo.app
        PRODUCT_NAME: Paqo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PaqoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Config/PaqoWidgets-Info.plist
      properties:
        CFBundleDisplayName: Paqo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paqo.app.widgets
        PRODUCT_NAME: PaqoWidgets
        SKIP_INSTALL: "YES"

schemes:
  Paqo:
    build:
      targets:
        Paqo: all
        PaqoWidgets: all
    run:
      config: Debug
    archive:
      config: Release
